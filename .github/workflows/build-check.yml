name: Build check

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 12.15.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint source
        run: pnpm lint

      - name: Run contact regression checks
        run: pnpm test:contact

      - name: Run SEO regression checks
        run: pnpm test:seo

      - name: Run service navigation regression checks
        run: pnpm test:services

      - name: Run quote and PDF regression checks
        run: pnpm test:quotes

      - name: Run standalone packaging regression checks
        run: pnpm test:standalone

      - name: Build standalone app
        run: pnpm build

      - name: Verify standalone artifact
        run: test -f .next/standalone/server.js

      - name: Build Docker image
        run: docker build --target runner -t cwb-website:local .

      - name: Start CMS test stack
        run: |
          pnpm cms:setup
          PAYLOAD_PUBLIC_SERVER_URL=http://127.0.0.1:3100 WEB_PORT=3100 docker compose -p cwb-cms-test up -d --wait --wait-timeout 120

      - name: Verify CMS publishing and persistence
        env:
          CMS_TEST_ALLOW_WRITES: "1"
          CMS_TEST_BOOTSTRAP: "1"
          CMS_TEST_RESTART_PROJECT: cwb-cms-test
        run: pnpm test:cms

      - name: Verify rendered SEO and service discovery
        run: pnpm test:seo:http

      - name: Verify private quotes and acceptance
        env:
          CMS_TEST_ALLOW_WRITES: "1"
          CMS_TEST_URL: http://127.0.0.1:3100
          CMS_TEST_EMAIL: quotes-ci@example.test
          CMS_TEST_PASSWORD: disposable-local-quotes-ci-only
        run: pnpm test:quotes:integration

      - name: Stop CMS test stack
        if: always()
        run: docker compose -p cwb-cms-test down --volumes
