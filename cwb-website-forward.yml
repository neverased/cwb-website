http:
  routers:
    cwb-website-www:
      rule: Host(`www.wojciechbajer.com`)
      entryPoints:
        - websecure
      tls:
        certResolver: myresolver
      middlewares:
        - cwb-website-canonical-host
      service: cwb-website-forward
    cwb-website-forward:
      rule: Host(`wojciechbajer.com`)
      entryPoints:
        - websecure
      tls:
        certResolver: myresolver
      service: cwb-website-forward
  middlewares:
    cwb-website-canonical-host:
      redirectRegex:
        regex: '^https://www\.wojciechbajer\.com/(.*)'
        replacement: "https://wojciechbajer.com/${1}"
        permanent: true
  services:
    cwb-website-forward:
      loadBalancer:
        passHostHeader: true
        serversTransport: cwb-website-backend-tls
        servers:
          - url: "https://192.168.1.100:3443" # QNAP LAN IP; see docs/backend-tls.md
  serversTransports:
    cwb-website-backend-tls:
      serverName: cwb-website-backend
      insecureSkipVerify: false
      rootCAs:
        - /etc/traefik/cwb-backend-tls/server-ca.crt
      certificates:
        - certFile: /etc/traefik/cwb-backend-tls/client.crt
          keyFile: /etc/traefik/cwb-backend-tls/client.key
