# Opt-in remote-proxy transport. Provision certificates before starting this overlay.
services:
  web:
    ports:
      - "${BACKEND_TLS_BIND_ADDRESS:?Set the backend host LAN address}:3443:3443"

  backend-tls:
    image: traefik:v3.7.17@sha256:f4bb143d1135a579b630ed491e17ec50f6f7c9c6a30585ff3d385471d2a86f5a
    # Keep the unencrypted hop on loopback inside the application's namespace.
    network_mode: service:web
    depends_on:
      web:
        condition: service_healthy
        restart: true
    entrypoint: ["traefik"]
    command: ["--configFile=/etc/traefik/traefik.yml"]
    read_only: true
    restart: unless-stopped
    volumes:
      - type: bind
        source: ${BACKEND_TLS_CONFIG_DIR:-./deploy/backend-tls}/traefik.yml
        target: /etc/traefik/traefik.yml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${BACKEND_TLS_CONFIG_DIR:-./deploy/backend-tls}/dynamic
        target: /etc/traefik/dynamic
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${BACKEND_TLS_CERT_DIR:?Set the absolute directory containing backend TLS certificates}
        target: /etc/traefik/tls
        read_only: true
        bind:
          create_host_path: false
