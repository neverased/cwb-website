services:
  web:
    image: cwb-website:local
    build:
      context: .
      target: runner
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://cwb:${POSTGRES_PASSWORD:?Run pnpm cms:setup first}@db:5432/cwb
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?Run pnpm cms:setup first}
      PAYLOAD_UPLOAD_DIR: /app/storage/media
      PAYLOAD_PUBLIC_SERVER_URL: ${PAYLOAD_PUBLIC_SERVER_URL:-}
      CONTACT_FORM_SECRET: ${CONTACT_FORM_SECRET:-}
      CONTACT_FROM: ${CONTACT_FROM:-mail@wojciechbajer.com}
      CONTACT_RECIPIENT: ${CONTACT_RECIPIENT:-mail@wojciechbajer.com}
      CONTACT_STORAGE_DIR: /app/storage/contact
      HOSTNAME: 0.0.0.0
      NEXT_TELEMETRY_DISABLED: "1"
      NODE_ENV: production
      PORT: 3000
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-3010}:3000"
    restart: unless-stopped
    volumes:
      - contact-data:/app/storage/contact
      - media-data:/app/storage/media

  db:
    image: postgres:18-bookworm
    environment:
      POSTGRES_DB: cwb
      POSTGRES_USER: cwb
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run pnpm cms:setup first}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cwb -d cwb"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  contact-data:
  media-data:
  postgres-data:
